---
# Resize LV (grow or shrink)
- name: Resize logical volume
  lvol:
    vg: "{{ lvm_vg }}"
    lv: "{{ lvm_lv }}"
    size: "{{ lvm_resize }}"
  when:
    - lvm_resize is defined
    - lvm_resize | length > 0

# Grow filesystem (XFS)
- name: Grow XFS filesystem
  command: xfs_growfs "{{ lvm_mount }}"
  when:
    - lvm_resize is defined
    - lvm_resize | length > 0
    - ansible_facts['filesystem'][lvm_mount]['fstype'] == "xfs"

# Shrink filesystem (EXT4 only)
- name: Shrink EXT4 filesystem
  command: resize2fs "{{ lvm_mount }}" "{{ lvm_resize }}"
  when:
    - lvm_resize is defined
    - lvm_resize | length > 0
    - ansible_facts['filesystem'][lvm_mount]['fstype'] == "ext4"

# Shrink LV (EXT4 only)
- name: Shrink logical volume (EXT4 only)
  lvol:
    vg: "{{ lvm_vg }}"
    lv: "{{ lvm_lv }}"
    size: "{{ lvm_resize }}"
  when:
    - lvm_resize is defined
    - lvm_resize | length > 0
    - ansible_facts['filesystem'][lvm_mount]['fstype'] == "ext4"

- name: Fail if disk is not provided
  fail:
    msg: "You must specify lvm_disk=/dev/sdX"
  when: lvm_disk is not defined

- name: Check if disk exists
  stat:
    path: "{{ lvm_disk }}"
  register: disk_check

- name: Fail if disk does not exist
  fail:
    msg: "Disk {{ lvm_disk }} does not exist on this node"
  when: not disk_check.stat.exists

- name: Create PV
  command: pvcreate {{ lvm_disk }}
  args:
    creates: "/dev/{{ lvm_disk | basename }}"

- name: Extend VG
  command: vgextend vgdata {{ lvm_disk }}

- name: Extend LV
  command: lvextend -r -L +{{ lvm_resize }} /dev/vgdata/lvstore
  when: lvm_resize is defined