---
# SAFETY: Require manual disk selection
- name: Fail if disk is not provided
  fail:
    msg: "You must specify lvm_disk=/dev/sdX"
  when: lvm_disk is not defined

# SAFETY: Ensure disk exists
- name: Check if disk exists
  stat:
    path: "{{ lvm_disk }}"
  register: disk_check

- name: Fail if disk does not exist
  fail:
    msg: "Disk {{ lvm_disk }} does not exist on this node"
  when: not disk_check.stat.exists

# Create PV
- name: Create PV
  command: pvcreate {{ lvm_disk }}
  args:
    creates: "/dev/{{ lvm_disk | basename }}"

# Extend VG
- name: Extend VG
  command: vgextend {{ lvm_vg }} {{ lvm_disk }}

# SAFETY: Only allow grow operations (+XG)
- name: Fail if lvm_resize is not a grow operation
  fail:
    msg: "lvm_resize must be a grow value like +1G, +2G, +500M. Shrinking is not allowed."
  when:
    - lvm_resize is defined
    - not lvm_resize.startswith('+')

# Grow LV and filesystem (XFS or EXT4)
- name: Extend LV and filesystem
  command: lvextend -r -L {{ lvm_resize }} /dev/{{ lvm_vg }}/{{ lvm_lv }}
  when: lvm_resize is defined
